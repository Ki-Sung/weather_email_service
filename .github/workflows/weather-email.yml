name: Weather Email Daily

on:
  schedule:
    # GitHub cron은 수 시간 밀릴 수 있어, 늦게 걸려도 아침에 오게 앞당긴다.
    # 같은 날 한 번만 보내도록 cache로 막고, 백업 슬롯으로 누락을 보완한다.
    - cron: "7 20 * * *"    # KST 05:07
    - cron: "7 21 * * *"    # KST 06:07
    - cron: "7 22 * * *"    # KST 07:07
  workflow_dispatch:

concurrency:
  group: weather-email-daily
  cancel-in-progress: false

jobs:
  send-weather-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: KST date
        id: kst
        run: echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Already sent today
        id: sent
        uses: actions/cache@v4
        with:
          path: .weather-email-sent
          key: weather-email-sent-${{ steps.kst.outputs.date }}

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.sent.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Send weather email
        if: github.event_name == 'workflow_dispatch' || steps.sent.outputs.cache-hit != 'true'
        working-directory: app
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          BCC_RECIPIENTS: ${{ secrets.BCC_RECIPIENTS }}
        run: python main.py --now

      - name: Mark sent
        if: success() && (github.event_name == 'workflow_dispatch' || steps.sent.outputs.cache-hit != 'true')
        run: echo sent > .weather-email-sent
